    <script>
      // fallback when browser storage is blocked (private mode / sandboxed preview)
      (function () {
        try { var k = '__rk'; window.localStorage.setItem(k, k); window.localStorage.removeItem(k) } catch (e) {
          var m = {}; var mem = { getItem: function (k) { return k in m ? m[k] : null }, setItem: function (k, v) { m[k] = String(v) },
            removeItem: function (k) { delete m[k] }, clear: function () { m = {} }, key: function (i) { return Object.keys(m)[i] || null },
            get length() { return Object.keys(m).length } };
          try { Object.defineProperty(window, 'localStorage', { value: mem, configurable: true }) } catch (e2) {}
          try { Object.defineProperty(window, 'sessionStorage', { value: mem, configurable: true }) } catch (e3) {}
        }
      })()
    </script>
