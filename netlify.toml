[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web SDK config is public by design: Vite inlines VITE_* values into
  # the client bundle, and access is enforced by Firestore/Storage security rules.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
